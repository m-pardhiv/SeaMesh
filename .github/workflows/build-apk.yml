# Builds the SeaMesh Android app (debug APK) on every push that touches the app,
# or manually from the Actions tab ("Run workflow").
#
# The APK is attached to the run as an artifact, and on main it is also published
# as the "apk-latest" release, so phones can download it directly from:
#   https://github.com/<owner>/<repo>/releases/download/apk-latest/SeaMesh.apk

name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "seamesh mobile connection/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the apk-latest release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: seamesh mobile connection

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The project has no gradlew wrapper script, so install the Gradle version
      # named in gradle/wrapper/gradle-wrapper.properties directly
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          apk=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Built: $apk"
          cp "$apk" "$GITHUB_WORKSPACE/SeaMesh.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaMesh-apk
          path: SeaMesh.apk
          if-no-files-found: error

      - name: Publish to the apk-latest release
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest SeaMesh.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "SeaMesh app (latest build)" \
            --notes "Debug APK built from ${{ github.sha }}. Install on each phone; allow 'Install unknown apps' when asked."
